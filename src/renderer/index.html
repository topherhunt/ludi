<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>LUDI Music Player</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar for playlists (future feature) -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Library</h2>
        <button id="addLibraryBtn" class="add-btn" title="Add">+</button>
        <div id="addLibraryDropdown" class="dropdown-menu">
          <div class="dropdown-item" id="newFolderMenuItem">New Folder</div>
        </div>
      </div>
      <div class="playlist-list" id="playlistList">
        <!-- Playlists will be rendered here -->
      </div>
    </aside>

    <!-- Main panel with nested folder explorer -->
    <main class="main-panel">
      <div class="explorer-header">
        <h1 id="currentListTitle">Main Library</h1>
        <div class="explorer-controls">
          <button id="collapseAllBtn" title="Collapse All">Collapse All</button>
          <button id="expandAllBtn" title="Expand All">Expand All</button>
        </div>
      </div>

      <div class="explorer-container" id="explorerContainer">
        <div class="drop-indicator" id="dropIndicator"></div>
        <ul class="explorer-tree" id="explorerTree" data-list-id="0">
          <!-- Tree items will be rendered here -->
        </ul>
      </div>
    </main>

    <!-- Player controls at bottom -->
    <footer class="player-controls">
      <div class="player-info">
        <div class="song-title" id="currentSongTitle">No song playing</div>
        <div class="song-artist" id="currentSongArtist"></div>
      </div>

      <div class="playback-controls">
        <button id="shuffleBtn" title="Shuffle" class="toggle-btn">🔀</button>
        <button id="prevBtn" title="Previous" disabled>⏮</button>
        <button id="playPauseBtn" title="Play/Pause" disabled>▶</button>
        <button id="nextBtn" title="Next" disabled>⏭</button>
        <button id="loopBtn" title="Loop: Off" class="toggle-btn">🔁</button>
      </div>

      <div class="time-controls">
        <span id="currentTime">0:00</span>
        <input type="range" id="seekBar" min="0" max="100" value="0" disabled>
        <span id="totalTime">0:00</span>
      </div>

      <div class="volume-controls">
        <button id="muteBtn" title="Mute">🔊</button>
        <input type="range" id="volumeSlider" min="0" max="100" value="100">
      </div>
    </footer>
  </div>

  <!-- Modal Dialog -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal-dialog">
      <div class="modal-content" id="modalContent"></div>
      <div class="modal-buttons" id="modalButtons">
        <button id="modalOkBtn" class="modal-btn">OK</button>
      </div>
    </div>
  </div>

  <!-- Rename Modal -->
  <div id="renameModalOverlay" class="modal-overlay">
    <div class="modal-dialog">
      <div class="modal-content">
        <label for="renameInput">Folder Name:</label>
        <input type="text" id="renameInput" class="modal-input" placeholder="Enter folder name">
      </div>
      <div class="modal-buttons">
        <button id="renameCancelBtn" class="modal-btn modal-btn-secondary">Cancel</button>
        <button id="renameOkBtn" class="modal-btn">OK</button>
      </div>
    </div>
  </div>

  <script src="howler.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
