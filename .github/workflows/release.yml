name: Build and Release

# Push a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to build the
# macOS .dmg and attach it to a draft GitHub Release for that tag.
# Can also be run manually (workflow_dispatch) to verify the build without releasing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # required for the release job to create/update the Release

jobs:
  build:
    strategy:
      fail-fast: false # a failure on one OS shouldn't cancel the others
      matrix:
        include:
          # Apple Silicon only, by design -- macos-latest runners are arm64, so this
          # produces an arm64 .dmg. No Intel build.
          - os: macos-latest
            assets: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ad-hoc signs the app and fails the build if the signature doesn't seal the
      # bundle -- see scripts/verify-signature.js. No signing secrets are needed.
      - run: npm run release

      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.os }}
          path: ${{ matrix.assets }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # only release on a tag, not manual runs
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true # download + smoke-test the .dmg, then click Publish
          generate_release_notes: true
