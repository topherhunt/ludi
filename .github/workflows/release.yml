name: Build

# Run manually to verify the .dmg builds on a clean runner. Releases are cut locally
# with scripts/release.sh; there is deliberately no tag trigger, since that script's
# tag would start a second, competing build.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false # a failure on one OS shouldn't cancel the others
      matrix:
        include:
          # Apple Silicon only, by design -- macos-latest runners are arm64, so this
          # produces an arm64 .dmg. No Intel build.
          - os: macos-latest
            assets: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The runner has no "Ludi Signing" cert, so this signs ad-hoc; it still fails the
      # build if the signature doesn't seal the bundle -- see scripts/verify-signature.js.
      - run: npm run release -- -c.mac.identity=-

      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.os }}
          path: ${{ matrix.assets }}
          if-no-files-found: error

